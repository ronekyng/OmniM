syntax = "proto3";

package omnim;

import "omnim.proto";

// === Omcom Top-Level ===

message OmniCommand {
  string version = 1;
  string id = 2;
  Action action = 3;
  Actor actor = 4;
  Target target = 5;
  repeated Operation operations = 6;
  ValidationResult validation = 7;
  Timestamp timestamp = 8;
  map<string, string> metadata = 9;
}

message Actor {
  string id = 1;
  ActorType type = 2;
}

enum ActorType {
  ACTOR_TYPE_UNSPECIFIED = 0;
  USER = 1;
  AI_AGENT = 2;
  SYSTEM = 3;
  IMPORT = 4;
}

message Target {
  oneof target_type {
    ObjectTarget object = 1;
    GeometryTarget geometry = 2;
    SelectionTarget selection = 3;
    SceneTarget scene = 4;
    LifecycleTarget lifecycle = 5;
  }
}

message ObjectTarget {
  string object_id = 1;
}

message GeometryTarget {
  string geometry_id = 1;
}

message SelectionTarget {
  repeated string object_ids = 1;
}

message SceneTarget {
  string scene_id = 1;
}

message LifecycleTarget {
  string record_id = 1;
}

enum Action {
  ACTION_UNSPECIFIED = 0;

  // Object operations
  CREATE_OBJECT = 1;
  MODIFY_OBJECT = 2;
  DELETE_OBJECT = 3;
  COPY_OBJECT = 4;
  MOVE_OBJECT = 5;

  // Geometry operations
  CREATE_GEOMETRY = 10;
  MODIFY_GEOMETRY = 11;
  DELETE_GEOMETRY = 12;
  TRANSFORM_GEOMETRY = 13;
  BOOLEAN_OPERATION = 14;

  // Property operations
  SET_PROPERTY = 20;
  DELETE_PROPERTY = 21;
  ADD_PROPERTY_SET = 22;
  REMOVE_PROPERTY_SET = 23;

  // Relation operations
  ADD_CONTAINMENT = 30;
  REMOVE_CONTAINMENT = 31;
  ADD_CONNECTION = 32;
  REMOVE_CONNECTION = 33;

  // Batch operations
  ARRAY = 40;
  BATCH_DELETE = 41;
  BATCH_TRANSFORM = 42;

  // Material operations
  SET_MATERIAL = 50;
  CREATE_MATERIAL = 51;

  // Lifecycle operations
  CREATE_LIFECYCLE_RECORD = 70;
  MODIFY_LIFECYCLE_RECORD = 71;
  DELETE_LIFECYCLE_RECORD = 72;
  LINK_RECORD_TO_OBJECT = 73;
  UPDATE_SCHEDULE = 75;
  UPDATE_COST = 76;
  UPDATE_PROGRESS = 77;
  CREATE_WORK_ORDER = 80;  // Unimplemented: declared but no Executor handler yet (see RFC)
  UPDATE_WORK_ORDER = 81;  // Unimplemented: declared but no Executor handler yet (see RFC)
  INGEST_SENSOR_DATA = 82; // Unimplemented: declared but no Executor handler yet (Digital Twin scope, see RFC)

  // Import/Export
  IMPORT_FILE = 60;
  EXPORT_FILE = 61;
  PARSE_TO_OMCOM = 62; // Unimplemented: declared but no Executor handler yet (text-DSL scope, RFC-0001)

  // Sketch operations
  CREATE_SKETCH = 100;
  ADD_SKETCH_ENTITY = 101;
  ADD_SKETCH_CONSTRAINT = 102;
  SOLVE_SKETCH = 103;
  DELETE_SKETCH_ENTITY = 104;
  REMOVE_SKETCH_CONSTRAINT = 105;
  DELETE_SKETCH = 106;

  // Feature operations (sketch → 3D body)
  EXTRUDE_SKETCH = 107;      // direct sketch extrusion (also available via ADD_FEATURE)
  REVOLVE_SKETCH = 108;      // direct sketch revolution (also available via ADD_FEATURE)
  // 2026-10-28 Wave 1 Slice 3: sketch-detail ops
  UPDATE_SKETCH = 109;
  UPDATE_SKETCH_ENTITY = 118; // sketch group continued past the 3D-feature/component blocks (107–115)

  // Component operations
  CREATE_COMPONENT = 110;
  ADD_FEATURE = 111;
  REMOVE_FEATURE = 112;
  REBUILD_FEATURES = 113;
  // 2026-10-28 Wave 1 Slice 3: component-detail ops
  DELETE_COMPONENT = 114;    // instance delete (distinct from DELETE_COMPONENT_DEF 206)
  UPDATE_FEATURE = 115;

  // Validation
  VALIDATE = 90;

  // Catalog operations
  DEFINE_COMPONENT = 200;
  ADD_COMPONENT_PARAM = 201;
  ADD_CONNECTOR = 202;
  ADD_COMPONENT_FEATURE = 203;
  PUBLISH_COMPONENT = 204;
  LIST_CATALOG = 205;
  DELETE_COMPONENT_DEF = 206;
  // 2026-10-28 Wave 1 Slice 3: catalog-detail ops
  UPDATE_COMPONENT_DEF = 207;
  UPDATE_COMPONENT_PARAM = 208;
  DELETE_COMPONENT_PARAM = 209;
  ASSIGN_FEATURE_TREE = 218; // catalog group continued past the series block (210–217)

  // Series operations
  CREATE_SERIES = 210;
  ADD_SELECTOR = 211;
  ADD_ANSWER = 212;
  ADD_SPEC_COMPONENT = 213;
  ADD_PARAM_CONSTRAINT = 214;
  LIST_SERIES = 215;
  DELETE_SERIES = 216;
  LOAD_SERIES = 217;
  // 2026-10-28 Wave 1 Slice 4: series detail ops
  UPDATE_SERIES = 219;
  UPDATE_PARAM_CONSTRAINT = 220;
  DELETE_PARAM_CONSTRAINT = 221;

  // 2026-10-28 Wave 1 Slice 4: measurement ops
  CREATE_MEASUREMENT = 222;
  DELETE_MEASUREMENT = 223;

  // 2026-10-28 Wave 1 Slice 4: administrative division ops
  CREATE_ADMINISTRATIVE_DIVISION = 224;
  DELETE_ADMINISTRATIVE_DIVISION = 225;

  // 2026-10-28 Wave 1 Slice 4: breakdown structure ops
  CREATE_BREAKDOWN_NODE = 226;
  DELETE_BREAKDOWN_NODE = 227;
  LINK_BREAKDOWN_OBJECT = 228;
  LINK_BREAKDOWN_ADMINISTRATIVE = 229;

  // 2026-10-28 Wave 1 Slice 5: catalog instantiation
  INSTANTIATE_CATALOG = 230;

  // 2026-10-29 P8-S1: grid datum
  CREATE_GRID_LINE = 231;
  UPDATE_GRID_LINE = 232;
  DELETE_GRID_LINE = 233;
}

// === Operations ===

message Operation {
  oneof op {
    ParametricOperation create_geometry = 1;
    CreateObjectOperation create_object = 2;
    ModifyObjectOperation modify_object = 3;
    Property set_property = 4;
    PropertySet add_property_set = 5;
    Containment add_containment = 6;
    Connection add_connection = 7;
    SetMaterialOperation set_material = 8;
    CreateLifecycleRecordOperation create_lifecycle_record = 9;
    ModifyLifecycleRecordOperation modify_lifecycle_record = 10;
    DeletePropertyOperation delete_property = 11;
    RemovePropertySetOperation remove_property_set = 12;
    RemoveContainmentOperation remove_containment = 13;
    RemoveConnectionOperation remove_connection = 14;
    CopyObjectOperation copy_object = 15;
    MoveObjectOperation move_object = 16;
    ArrayOperation array = 17;
    BooleanOperation boolean = 18;
    TransformGeometryOperation transform_geometry = 19;
    DeleteLifecycleRecordOperation delete_lifecycle_record = 20;
    LinkRecordToObjectOperation link_record_to_object = 21;
    UpdateScheduleOperation update_schedule = 22;
    UpdateCostOperation update_cost = 23;
    UpdateProgressOperation update_progress = 24;
    CreateWorkOrderOperation create_work_order = 25;
    UpdateWorkOrderOperation update_work_order = 26;
    CreateSketchOperation create_sketch = 27;
    AddSketchEntityOperation add_sketch_entity = 28;
    AddSketchConstraintOperation add_sketch_constraint = 29;
    SolveSketchOperation solve_sketch = 30;
    DeleteSketchEntityOperation delete_sketch_entity = 31;
    RemoveSketchConstraintOperation remove_sketch_constraint = 32;
    DeleteSketchOperation delete_sketch = 33;
    ExtrudeSketchOperation extrude_sketch = 34;
    RevolveSketchOperation revolve_sketch = 35;
    CreateComponentOperation create_component = 36;
    AddFeatureOperation add_feature = 37;
    RemoveFeatureOperation remove_feature = 38;
    RebuildFeaturesOperation rebuild_features = 39;
    DefineComponentOperation define_component = 40;
    AddComponentParamOperation add_component_param = 41;
    AddConnectorOperation add_connector = 42;
    PublishComponentOperation publish_component = 43;
    DeleteComponentDefOperation delete_component_def = 44;
    CreateSeriesOperation create_series = 45;
    AddSelectorOperation add_selector = 46;
    AddAnswerOperation add_answer = 47;
    AddSpecComponentOperation add_spec_component = 48;
    AddParamConstraintOperation add_param_constraint = 49;
    DeleteSeriesOperation delete_series = 50;
    LoadSeriesOperation load_series = 51;
    // 2026-10-28 Wave 1 Slice 2: material & object-detail ops
    CreateMaterialOperation create_material = 52;
    SetObjectPropertyOperation set_object_property = 53;
    // 2026-10-28 Wave 1 Slice 3: sketch / component / catalog detail ops
    UpdateSketchOperation update_sketch = 54;
    UpdateSketchEntityOperation update_sketch_entity = 55;
    DeleteComponentOperation delete_component = 56;
    UpdateFeatureOperation update_feature = 57;
    UpdateComponentDefOperation update_component_def = 58;
    UpdateComponentParamOperation update_component_param = 59;
    DeleteComponentParamOperation delete_component_param = 60;
    AssignFeatureTreeOperation assign_feature_tree = 61;
    // 2026-10-28 Wave 1 Slice 4: series detail ops
    UpdateSeriesOperation update_series = 62;
    UpdateParamConstraintOperation update_param_constraint = 63;
    DeleteParamConstraintOperation delete_param_constraint = 64;
    // 2026-10-28 Wave 1 Slice 4: measurement ops
    CreateMeasurementOperation create_measurement = 65;
    DeleteMeasurementOperation delete_measurement = 66;
    // 2026-10-28 Wave 1 Slice 4: administrative division ops
    CreateAdministrativeDivisionOperation create_administrative_division = 67;
    DeleteAdministrativeDivisionOperation delete_administrative_division = 68;
    // 2026-10-28 Wave 1 Slice 4: breakdown structure ops
    CreateBreakdownNodeOperation create_breakdown_node = 69;
    DeleteBreakdownNodeOperation delete_breakdown_node = 70;
    LinkBreakdownObjectOperation link_breakdown_object = 71;
    LinkBreakdownAdministrativeOperation link_breakdown_administrative = 72;
    // 2026-10-28 Wave 1 Slice 5: catalog instantiation as one undoable command
    InstantiateCatalogOperation instantiate_catalog = 73;
    // 2026-10-29 P8-S1: grid datum ops
    CreateGridLineOperation create_grid_line = 74;
    UpdateGridLineOperation update_grid_line = 75;
    DeleteGridLineOperation delete_grid_line = 76;
  }
}

message SetObjectPropertyOperation {
  string object_id = 1;
  Property property = 2;
}

message CreateMaterialOperation {
  Material material = 1;
}

message CreateObjectOperation {
  ObjectType type = 1;
  string name = 2;
  string description = 3;
  ParametricGeometry geometry = 4;
  repeated Property properties = 5;
  string parent_id = 6;
  // 2026-10-29 P8-S1: building datum — elevation is meaningful on
  // BuildingStorey (IfcBuildingStorey.Elevation); level_id attaches an object
  // to a storey element (must reference an existing BuildingStorey).
  optional double elevation = 7;
  optional string level_id = 8;
  // 2026-10-29 P8-S2: vertical extent constraints (both-or-neither).
  // The object's base resolves to bottom's elevation and, for PathSweep
  // geometry, its height to top − bottom.
  optional string bottom_level_id = 9;
  optional string top_level_id = 10;
}

message ModifyObjectOperation {
  string object_id = 1;
  optional string new_name = 2;
  optional string new_description = 3;
  optional ParametricGeometry new_geometry = 4;
  // 2026-10-28 Wave 1 Slice 2: object detail edits
  optional string new_ifc_class = 5;
  optional TagList new_tags = 6;
  // 2026-10-29 P8-S1: datum edits (Some("") clears level_id)
  optional double new_elevation = 7;
  optional string new_level_id = 8;
  // 2026-10-29 P8-S2: extent constraints (Some("") clears; both-or-neither)
  optional string new_bottom_level_id = 9;
  optional string new_top_level_id = 10;
}

// Wrapper so optional repeated tags are distinguishable from "untouched".
message TagList {
  repeated string values = 1;
}

message SetMaterialOperation {
  string object_id = 1;
  string material_id = 2;
}

message CreateLifecycleRecordOperation {
  LifecyclePhase phase = 1;
  string name = 2;
  string description = 3;
  string record_type = 4;
  repeated string related_object_ids = 5;
  repeated Property properties = 6;
}

message ModifyLifecycleRecordOperation {
  string record_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional RecordStatus status = 4;
  repeated Property properties = 5;
}

// === Property Operations ===

message DeletePropertyOperation {
  string name = 1;
}

message RemovePropertySetOperation {
  string name = 1;
}

// === Relation Operations ===

message RemoveContainmentOperation {
  string parent_id = 1;
  string child_id = 2;
}

message RemoveConnectionOperation {
  string from_object_id = 1;
  string to_object_id = 2;
}

// === Object Copy/Move ===

message CopyObjectOperation {
  string source_object_id = 1;
  string new_name = 2;
  string parent_id = 3;
}

message MoveObjectOperation {
  string object_id = 1;
  string new_parent_id = 2;
}

// === Batch Operations ===

message ArrayOperation {
  string source_object_id = 1;
  string pattern = 2;        // "linear", "rectangular", "circular"
  int32 count_x = 3;
  int32 count_y = 4;
  int32 count_z = 5;
  double spacing_x = 6;
  double spacing_y = 7;
  double spacing_z = 8;
}

message BooleanOperation {
  string type = 1;            // "union", "subtract", "intersect"
  string target_object_id = 2;
  repeated string operand_object_ids = 3;
}

message TransformGeometryOperation {
  string object_id = 1;
  optional Point3D translation = 2;
  optional Rotation rotation = 3;
  optional Vector3D scale = 4;
  // Rotation/scale pivot; defaults to the mesh centroid (executor) when unset.
  optional Point3D pivot = 5;
}

// === Lifecycle Operations ===

message DeleteLifecycleRecordOperation {
  string record_id = 1;
}

message LinkRecordToObjectOperation {
  string record_id = 1;
  string object_id = 2;
  string link_role = 3;
}

message UpdateScheduleOperation {
  string record_id = 1;
  optional Timestamp planned_start = 2;
  optional Timestamp planned_finish = 3;
  optional Timestamp actual_start = 4;
  optional Timestamp actual_finish = 5;
}

message UpdateCostOperation {
  string record_id = 1;
  double planned_cost = 2;
  double actual_cost = 3;
  string currency = 4;
}

message UpdateProgressOperation {
  string record_id = 1;
  double percent_complete = 2;
  string note = 3;
}

message CreateWorkOrderOperation {
  string asset_object_id = 1;
  string title = 2;
  string description = 3;
}

message UpdateWorkOrderOperation {
  string work_order_id = 1;
  string status = 2;
  string description = 3;
}

// Reserved for future implementation (action values live in the Action enum; the Executor
// currently only echoes their names). Do NOT reuse these ids for other messages:
//   action=11  ModifyGeometryOperation
//   action=12  DeleteGeometryOperation
//   action=41  BatchDeleteOperation
//   action=42  BatchTransformOperation
//   action=203 AddComponentFeatureOperation

// === Sketch Operations ===

message SketchPointRef {
  int32 entity_index = 1;   // 1-based index of entity in the sketch
  int32 point_index = 2;    // 0 for free point, 1 for start, 2 for end (for line/arc)
}

message SketchData {
  string id = 1;
  string name = 2;
  Point3D origin = 3;        // workplane origin
  Vector3D normal = 4;       // workplane normal (0,0,0 = free 3D)
  repeated SketchEntityData entities = 5;
  repeated SketchConstraintData constraints = 6;
  bool solved = 7;           // whether the sketch is currently solved
  string component_id = 8;   // parent component (optional)
}

message SketchEntityData {
  string id = 1;
  SketchEntityType entity_type = 2;
  repeated Point3D points = 3;    // control points (line=2, circle=1+center, arc=3)
  double radius = 4;              // for circle/arc
  int32 sides = 5;                // for polygon
  // 2026-10-28 Wave 1 Slice 3: construction-geometry flag
  bool construction = 6;
}

enum SketchEntityType {
  SKETCH_ENTITY_UNSPECIFIED = 0;
  SKETCH_POINT = 1;
  SKETCH_LINE = 2;
  SKETCH_CIRCLE = 3;
  SKETCH_ARC = 4;
  SKETCH_WORKPLANE = 5;
  SKETCH_RECTANGLE = 6;
  SKETCH_POLYGON = 7;
  SKETCH_ELLIPSE = 8;
  SKETCH_SPLINE = 9;
  SKETCH_POLYLINE = 10;
}

message SketchConstraintData {
  string id = 1;
  SketchConstraintType constraint_type = 2;
  repeated SketchPointRef entity_refs = 3;  // entity references (1-based indices)
  double value = 4;                         // for distance/length/angle constraints
}

enum SketchConstraintType {
  SKETCH_CONSTRAINT_UNSPECIFIED = 0;
  SKETCH_HORIZONTAL = 1;
  SKETCH_VERTICAL = 2;
  SKETCH_COINCIDENT = 3;
  SKETCH_PARALLEL = 4;
  SKETCH_PERPENDICULAR = 5;
  SKETCH_LENGTH = 6;
  SKETCH_DISTANCE = 7;
  SKETCH_ANGLE = 8;
  SKETCH_RADIUS = 9;
  SKETCH_DIAMETER = 10;
  SKETCH_TANGENT = 11;
  SKETCH_SYMMETRIC = 12;
  SKETCH_FIXED = 13;
  SKETCH_AT_MIDPOINT = 14;
  SKETCH_EQUAL_LENGTH = 15;
  SKETCH_EQUAL_RADIUS = 16;
  SKETCH_PT_ON_LINE = 17;
  SKETCH_PT_ON_CIRCLE = 18;
  SKETCH_SAME_ORIENTATION = 19;
}

message CreateSketchOperation {
  string name = 1;
  Point3D origin = 2;
  Vector3D normal = 3;
  // 2026-10-28 Wave 1 Slice 3: optional owning component (empty = unowned)
  string component_id = 4;
}

message AddSketchEntityOperation {
  string sketch_id = 1;
  SketchEntityData entity = 2;
}

message AddSketchConstraintOperation {
  string sketch_id = 1;
  SketchConstraintData constraint = 2;
}

message SolveSketchOperation {
  string sketch_id = 1;
}

message DeleteSketchEntityOperation {
  string sketch_id = 1;
  int32 entity_index = 2;    // 1-based index
}

message RemoveSketchConstraintOperation {
  string sketch_id = 1;
  int32 constraint_index = 2; // 1-based index
}

message DeleteSketchOperation {
  string sketch_id = 1;
}

message ExtrudeSketchOperation {
  string sketch_id = 1;
  double depth = 2;
  Vector3D direction = 3;
}

message RevolveSketchOperation {
  string sketch_id = 1;
  double angle = 2;                  // radians, 0 = full 360°
  Point3D axis_origin = 3;
  Vector3D axis_direction = 4;
}

// === Component Operations ===

enum FeatureType {
  FEATURE_TYPE_UNSPECIFIED = 0;
  FEATURE_EXTRUDE = 1;
  FEATURE_REVOLVE = 2;
  FEATURE_SWEEP = 3;
  FEATURE_LOFT = 4;
  FEATURE_BOOLEAN = 5;
  FEATURE_CHAMFER = 6;
  FEATURE_FILLET = 7;
  FEATURE_PATTERN = 8;
  FEATURE_SHELL = 9;
  FEATURE_FUSION = 10;
  FEATURE_LOFTED_FUSION = 11;
}

message FeatureData {
  string id = 1;
  string name = 2;
  FeatureType feature_type = 3;
  string sketch_id = 4;              // primary source sketch (profile)
  repeated string dependency_ids = 5; // parent features
  double depth = 6;                  // extrude depth
  Vector3D direction = 7;            // extrude direction
  double angle = 8;                  // revolve angle
  Point3D axis_origin = 9;           // revolve axis origin
  Vector3D axis_direction = 10;      // revolve axis direction
  bool is_cut = 11;                  // when true, subtracts from parent geometry
  int32 order = 12;                  // position in component feature list
  // New fields for Feature as first-class entity
  repeated string input_sketch_ids = 13;  // additional sketches (Sweep path, Loft sections)
  omnim.MeshGeometry cached_geometry = 14; // cached 3D geometry result
  bool dirty = 15;                        // needs rebuild when inputs change
  string axis_sketch_id = 16;             // for revolve (replaces axis_origin/axis_direction)
}

message ComponentData {
  string id = 1;
  string name = 2;
  repeated string feature_ids = 3;   // ordered feature list
  repeated string sketch_ids = 4;    // sketches owned by this component
  string parent_id = 5;              // tree parent
  Transform transform = 6;           // local placement
  omnim.MeshGeometry merged_geometry = 7; // result of merging all Feature geometries
}

message CreateComponentOperation {
  string name = 1;
  string parent_id = 2;
}

message AddFeatureOperation {
  string component_id = 1;
  FeatureType feature_type = 2;
  string sketch_id = 3;
  double depth = 4;                  // for extrude
  Vector3D direction = 5;            // for extrude
  double angle = 6;                  // for revolve (radians)
  Point3D axis_origin = 7;           // for revolve
  Vector3D axis_direction = 8;       // for revolve
  bool is_cut = 9;                   // when true, subtracts from parent geometry
  // New fields
  repeated string input_sketch_ids = 10;  // Sweep path_sketch_id, Loft section sketch_ids
  string axis_sketch_id = 11;             // for revolve (replaces axis_origin/axis_direction)
  // 2026-10-28 Wave 1 Slice 3: REST add_feature parity (optional overrides)
  optional string name = 12;              // when set, overrides the auto-generated feature name
  optional double lod = 13;               // when set, overrides the default tolerance
}

message RemoveFeatureOperation {
  string component_id = 1;
  string feature_id = 2;             // feature to remove
}

message RebuildFeaturesOperation {
  string component_id = 1;
  optional string feature_id = 2;    // if set, rebuild from this feature onward; else rebuild all
}

// === Catalog Operations ===

message DefineComponentOperation {
  string name = 1;
  string category = 2;
  string description = 3;
  string ifc_class = 4;
  string standard_reference = 5;
  repeated string tags = 6;
  string domain = 7;
}

message AddComponentParamOperation {
  string component_id = 1;
  string param_name = 2;
  ParamType param_type = 3;
  double default_value = 4;
  double min_value = 5;
  double max_value = 6;
  double step = 7;
  string unit = 8;
  string formula = 9;
  repeated string choices = 10;
  string description = 11;
}

message AddConnectorOperation {
  string component_id = 1;
  string connector_id = 2;
  string connector_name = 3;
  string position_x_expr = 4;
  string position_y_expr = 5;
  string position_z_expr = 6;
  string direction_x_expr = 7;
  string direction_y_expr = 8;
  string direction_z_expr = 9;
  string bore_expr = 10;
  string connection_type_code = 11;
  ConnectorRole role = 12;
  // 2026-10-28 Wave 4: flange orientation (expression-resolved).
  string up_x_expr = 13;
  string up_y_expr = 14;
  string up_z_expr = 15;
}

message PublishComponentOperation {
  string component_id = 1;
}

message DeleteComponentDefOperation {
  string component_id = 1;
}

// 2026-10-28 Wave 1 Slice 3: sketch / component / catalog detail operations

message UpdateSketchOperation {
  string sketch_id = 1;
  optional Point3D origin = 2; // when set, replaces the workplane origin
  optional string name = 3;    // when set, renames the sketch
}

message UpdateSketchEntityOperation {
  string sketch_id = 1;
  int32 entity_index = 2;      // 1-based index
  PointList points = 3;        // when set, replaces the control points
  optional double radius = 4;
  optional int32 sides = 5;
  optional bool construction = 6;
}

message DeleteComponentOperation {
  string component_id = 1;     // component instance object id
}

message UpdateFeatureOperation {
  string component_id = 1;
  string feature_id = 2;
  optional string sketch_id = 3;
  optional string axis_sketch_id = 4;
  optional double depth = 5;
  optional double angle = 6;
  optional bool is_cut = 7;
  optional bool suppressed = 8;
  TagList input_sketch_ids = 9;      // when set, replaces the list
  TagList dependency_ids = 10;       // when set, replaces the list
  optional Vector3D direction = 11;
  optional Point3D axis_origin = 12;
  optional Vector3D axis_direction = 13;
  optional double lod = 14;
  optional int32 boolean_op = 15;    // raw update_feature mapping (0=union, 2=intersect, else subtract)
  optional int32 pattern_count_x = 16;
  optional int32 pattern_count_y = 17;
  optional int32 pattern_count_z = 18;
}

message UpdateComponentDefOperation {
  string component_id = 1;
  optional string name = 2;
  optional string category = 3;
  optional string description = 4;
  optional string ifc_class = 5;
  optional string standard_reference = 6;
  TagList tags = 7;                    // when set, replaces the tag list
  optional string domain = 8;
  TagList allowed_materials = 9;       // when set, replaces the list
  optional string default_material = 10;
  map<string, string> properties = 11; // when set, replaces the map
}

message UpdateComponentParamOperation {
  string component_id = 1;
  int32 param_index = 2;               // 1-based index
  optional string name = 3;
  optional int32 param_type = 4;
  optional double default_value = 5;
  optional double min_value = 6;
  optional double max_value = 7;
  optional double step = 8;
  optional string unit = 9;
  optional string formula = 10;
  TagList choices = 11;                // when set, replaces the choices
  optional string description = 12;
}

message DeleteComponentParamOperation {
  string component_id = 1;
  int32 param_index = 2;               // 1-based index
}

message AssignFeatureTreeOperation {
  string component_id = 1;
  string feature_tree_id = 2;
}

message PointList {
  repeated Point3D values = 1;
}

message CreateSeriesOperation {
  string name = 1;
  string description = 2;
  string domain = 3;
  string standard_reference = 4;
}

message AddSelectorOperation {
  string series_id = 1;
  string selector_id = 2;
  string question = 3;
}

message AddAnswerOperation {
  string series_id = 1;
  string selector_id = 2;
  string answer_id = 3;
  string answer_value = 4;
  bool is_numeric_range = 5;
  double range_min = 6;
  double range_max = 7;
}

message AddSpecComponentOperation {
  string series_id = 1;
  string selector_id = 2;
  string answer_id = 3;
  string component_def_id = 4;
  string material = 5;
  string connection_type_code = 6;
}

message AddParamConstraintOperation {
  string series_id = 1;
  string component_def_id = 2;
  string param_name = 3;
  double default_value = 4;
  double min_value = 5;
  double max_value = 6;
  double step = 7;
  string fixed_value = 8;
}

message DeleteSeriesOperation {
  string series_id = 1;
}

message LoadSeriesOperation {
  string path = 1;
  string source = 2;  // "standalone" | "library"
}

// 2026-10-28 Wave 1 Slice 4: series detail operations

message UpdateSeriesOperation {
  string series_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string domain = 4;
  optional string standard_reference = 5;
  // Repeated fields cannot be `optional`, so a flag distinguishes "absent"
  // from "clear the list".
  bool replace_applicable_phases = 6;
  repeated string applicable_phases = 7;
  bool replace_metadata = 8;
  map<string, string> metadata = 9;
}

message UpdateParamConstraintOperation {
  string series_id = 1;
  string component_def_id = 2;
  uint32 param_index = 3;
  optional string param_name = 4;
  optional double default_value = 5;
  optional double min_value = 6;
  optional double max_value = 7;
  optional double step = 8;
  optional string fixed_value = 9;
}

message DeleteParamConstraintOperation {
  string series_id = 1;
  string component_def_id = 2;
  uint32 param_index = 3;
}

// 2026-10-28 Wave 1 Slice 4: measurement operations

message CreateMeasurementOperation {
  string measurement_type = 1;
  repeated Point3D points = 2;
  double value = 3;
  optional string label = 4;
  optional string color = 5;
}

message DeleteMeasurementOperation {
  string measurement_id = 1;
}

// 2026-10-28 Wave 1 Slice 4: administrative division operations

message CreateAdministrativeDivisionOperation {
  AdministrativeLevel level = 1;
  string name = 2;
  string code = 3;
  optional string native_name = 4;
  optional string parent_id = 5;
}

message DeleteAdministrativeDivisionOperation {
  string division_id = 1;
}

// 2026-10-28 Wave 1 Slice 4: breakdown structure operations

message CreateBreakdownNodeOperation {
  BreakdownLevel level = 1;
  string name = 2;
  BreakdownConvention convention = 3;
  optional string code = 4;
  optional string parent_id = 5;
}

message DeleteBreakdownNodeOperation {
  string node_id = 1;
}

message LinkBreakdownObjectOperation {
  string node_id = 1;
  string object_id = 2;
}

message LinkBreakdownAdministrativeOperation {
  string node_id = 1;
  string division_id = 2;
}

// === Validation ===

message ValidationResult {
  bool valid = 1;
  repeated ValidationError errors = 2;
  repeated ValidationWarning warnings = 3;
}

message ValidationError {
  string code = 1;
  string message = 2;
  string field = 3;
}

message ValidationWarning {
  string code = 1;
  string message = 2;
  string field = 3;
}

// 2026-10-28 Wave 1 Slice 5: catalog instantiation

message InstantiateCatalogOperation {
  string component_def_id = 1;
  string instance_name = 2;
  map<string, double> params = 3;
  optional Point3D position = 4;
  double rotation_z = 5;
  bool skip_series_gate = 6;
}

// 2026-10-29 P8-S1: grid datum operations (axes are datum curves, not objects)

enum GridAxis {
  GRID_AXIS_UNSPECIFIED = 0;
  GRID_AXIS_ALONG_X = 1;
  GRID_AXIS_ALONG_Y = 2;
}

message CreateGridLineOperation {
  string label = 1;
  GridAxis axis = 2;
  double coordinate = 3;
  double extent_min = 4;
  double extent_max = 5;
}

message UpdateGridLineOperation {
  string grid_line_id = 1;
  string label = 2;
  GridAxis axis = 3;
  double coordinate = 4;
  double extent_min = 5;
  double extent_max = 6;
}

message DeleteGridLineOperation {
  string grid_line_id = 1;
}
