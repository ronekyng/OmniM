[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/model",
    "crates/sketch",
    "crates/omcom",
    "crates/server",
    "crates/ifc",
    "crates/amir",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["OmniM Contributors"]

[workspace.dependencies]
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
wgpu = "24"
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
bytemuck = { version = "1.21", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5"
async-trait = "0.1"
slvs = "0.6.0"
truck-modeling = "0.6.0"
truck-polymesh = "0.6.0"
truck-topology = "0.6.0"
truck-base = "0.5.0"
